<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071018"><meta name="description" content="Yggdrasil, assistente pessoal por voz">
<link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>Yggdrasil</title>
</head>
<body>
<main class="app">
<header><div class="mark">ᛉ</div><div><p class="eyebrow">ASSISTENTE PESSOAL</p><h1>Yggdrasil</h1></div><span class="dot" id="dot"></span></header>
<section class="core-wrap"><div class="ring ring-a"></div><div class="ring ring-b"></div><button id="talk" class="core" type="button"><span class="symbol">ᛟ</span><span id="coreLabel">ATIVAR</span></button></section>
<p id="status" class="status" role="status">Sistema pronto</p>
<section class="conversation"><p class="eyebrow">CONVERSA</p><div id="messages"><article class="message"><b>YG</b><p>Sistemas online. Toque no núcleo e fale comigo.</p></article></div></section>
<p class="foot">PROTÓTIPO INICIAL · YGGDRASIL</p>
</main>
<script>
(function () {
  const button = document.getElementById('talk');
  const status = document.getElementById('status');
  button.addEventListener('click', function () {
    window.setTimeout(function () {
      if (status.textContent.trim() === 'Sistema pronto') {
        status.textContent = 'Toque recebido, mas o assistente não iniciou. A versão publicada pode estar desatualizada ou o app.js falhou.';
      }
    }, 150);
  }, true);
})();
</script>
<script src="app.js?v=20261015-2" onerror="document.getElementById('status').textContent='Erro: app.js não carregou. Confira a pasta raiz configurada na Vercel.'"></script>
</body></html>
